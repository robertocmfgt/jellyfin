  #   volumes:
  #     - /opt/jellyfin/config:/config
  #     - /opt/jellyfin/cache:/cache
  #     - /mnt/nas/output:/media/output:rw
  #     - /mnt/nas/output-1:/media/output-1:rw
  #   devices:
  #     # Intel iGPU / Quick Sync
  #     - /dev/dri:/dev/dri
  #   ports:
  #     - "8096:8096"
  #     - "8920:8920"
  #     - "1900:1900/udp"
