services:
  jellyfin:
    # Variant 1 (DEFAULT): CPU-only transcoding
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      # Optional: publish server on your LAN (clients can discover it more reliably)
      # - JELLYFIN_PublishedServerUrl=http://192.168.0.160
    volumes:
      # App data (bind mounts, per your requirement)
      - /opt/jellyfin/config:/config
      - /opt/jellyfin/cache:/cache

      # Media libraries (your NAS mounts)
      - /mnt/nas/output:/media/output:rw
      - /mnt/nas/output-1:/media/output-1:rw
    ports:
      # Jellyfin web UI / API
      - "8096:8096"
      # Optional HTTPS (only if you configure Jellyfin for it)
      - "8920:8920"
      # Optional DLNA discovery (only if you use DLNA)
      - "1900:1900/udp"
      - "7359:7359/udp"
    restart: always
    # Limit Watchtower to ONLY this container (label-based monitoring)
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  # Variant 2 (OPTIONAL): Intel Quick Sync (uncomment this whole service and comment the one above)
  # jellyfin:
  #   image: lscr.io/linuxserver/jellyfin:latest
  #   container_name: jellyfin
  #   environment:
  #     - PUID=${PUID}
  #     - PGID=${PGID}
