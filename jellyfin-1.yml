---
services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:latest
    container_name: jellyfin
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - JELLYFIN_PublishedServerUrl=192.168.0.24 # Optional published server URL
    volumes:
      - /config:/config:rw
      - /tv:/data/tvshows:ro
      - /movies/data:/data/movies:ro
    ports:
      - 8096:8096
      - 8920:8920 # Optional control port
      - 7359:7359/udp # Optional UPnP port
      - 1900:1900/udp # Optional SSDP port
    restart: unless-stopped